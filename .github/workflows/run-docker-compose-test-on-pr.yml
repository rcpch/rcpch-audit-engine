# Runs the Pytest test suite when PRs are made against any branch

name: Run Pytest via Docker Compose on all PRs

on:
    pull_request:
      branches:
        - "*"

jobs:
  build-and-run-pytest-suite-in-docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full code repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to allow git_context_processor.py to still work

      - name: Create .env file
        run: |
          cp envs/env-template envs/.env

      - name: Run PR check script
        env:
          # GitHub's ubuntu-latest runner exposes 2 vCPUs, so xdist 'auto'
          # only spawns 2 workers. Oversubscribe to 4: Django tests are
          # mostly DB I/O, not CPU, so extra workers help despite the
          # limited core count.
          E12_TEST_WORKERS: "4"
        run: |
          s/pr-check
