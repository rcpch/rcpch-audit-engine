<div class="ui three mini statistics"
    hx-get="{% url 'case_statistics' organisation_id=organisation.pk %}"
    hx-swap='innerHTML'
    name='case_statistics'
    hx-trigger='case_statistics from:body'
    hx-target='#case_statistics'
>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{total_cases_complete}}
        </div>
        <div class="label">
        Total Complete
        </div>
    </div>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{total_cases_incomplete}}
        </div>
        <div class="label">
        Total Incomplete
        </div>
    </div>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{ total_filtered_registered }}
        </div>
        <div class="label">
        Total
        </div>
    </div>
</div>
