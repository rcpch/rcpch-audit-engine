<div class="ui three mini statistics"
    hx-get="{% url 'case_statistics' organisation_id=organisation.pk %}"
    hx-swap='innerHTML'
    name='case_statistics'
    hx-trigger='case_statistics from:body'
    hx-target='#case_statistics'
>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{total_cases_in_current_submitting_cohort}}
        </div>
        <div class="label">
        Total (Cohort {{submitting_cohort}})
        </div>
    </div>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{total_cases}}
        </div>
        <div class="label">
        Total (All Cohorts)
        </div>
    </div>
    <div class="rcpch_light_blue statistic">
        <div class="value">
        {{total_registrations}}
        </div>
        <div class="label">
        Registered (All Cohorts)
        </div>
    </div>
</div>
