[pytest]

# POINT PYTEST AT PROJECT SETTINGS
DJANGO_SETTINGS_MODULE = rcpch-audit-engine.settings

# SET FILENAME FORMATS OF TESTS
python_files = test_*.py

# RE USE TEST DB AS DEFAULT
# Restored after xdist PR removed it (commit d260400f), which forced every
# pytest invocation to recreate + re-migrate the test DB. With s/pr-check
# and s/ci invoking pytest twice against the same compose session, the
# second run rebuilt the DB from scratch. Safe with xdist: the seed fixtures
# are idempotent (get_or_create on natural keys) and pytest-django's xdist
# support serialises test DB creation across workers.
addopts =
    --reuse-db

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
